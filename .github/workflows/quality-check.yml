# Name of the workflow
name: GiveWear Quality Check

# Triggers on pushes / pull-requests with main as target
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# What happens
jobs:
  eslint:
    name: JavaScript Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run ESLint
        run: |
          npx --yes --package eslint@9 --package @eslint/js@9 \
            eslint src/assets/js/index.js src/assets/js/confirmation.js \
            --config eslint.config.js
