# Name of the workflow
name: GiveWear Quality Check

# Triggers on pushes / pull-requests with main as target
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions
permissions:
  contents: read

# Jobs
jobs:

  # 1. Linting
  eslint:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ESLint dependencies
        run: npm install --no-save --package-lock=false eslint@10 @eslint/js@10
      - name: Run ESLint
        run: npx eslint src/assets/js/index.js src/assets/js/confirmation.js

  # 2. Building the Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: eslint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t givewear:latest .
      - name: Save Docker image
        run: docker save givewear:latest -o givewear-image.tar
      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: givewear-image
          path: givewear-image.tar
          retention-days: 1
  
  # 3. Publish to GHCR
  publish:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: [eslint, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v7
        with:
          name: givewear-image
      - name: Load Docker image
        run: docker load -i givewear-image.tar
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tag Docker image (latest + Commit SHA)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/givewear"
          docker tag givewear:latest "$IMAGE:latest"
          docker tag givewear:latest "$IMAGE:${GITHUB_SHA}"
      - name: Push Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/givewear"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
