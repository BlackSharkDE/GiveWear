services:
  web:
    # Image: Apache httpd (https://hub.docker.com/_/httpd/tags)
    image: httpd:2.4
    
    # Lokalen Port 8080 auf Port 80 im Container binden
    ports:
      - "8080:80"

    # Live mount vom Quellcode in das Webserver-Verzeichnis im Container
    volumes:
      - ./docs:/usr/local/apache2/htdocs/